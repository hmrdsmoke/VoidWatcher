<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Void Watcher hourglass -->
  <!-- Top and bottom frame caps -->
  <rect x="56" y="30" width="144" height="18" rx="6" fill="#1a1a1a"/>
  <rect x="56" y="208" width="144" height="18" rx="6" fill="#1a1a1a"/>

  <!-- Vertical side posts -->
  <rect x="60" y="40" width="12" height="176" rx="5" fill="#1a1a1a"/>
  <rect x="184" y="40" width="12" height="176" rx="5" fill="#1a1a1a"/>

  <!-- Glass body: two bulbs meeting at the neck -->
  <path d="M74 48
           C 74 96, 118 112, 128 128
           C 138 112, 182 96, 182 48
           Z" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M74 208
           C 74 160, 118 144, 128 128
           C 138 144, 182 160, 182 208
           Z" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round"/>

  <!-- Sand in the top bulb (draining, so a shallow mound) -->
  <path d="M88 62
           C 96 92, 120 106, 128 118
           C 136 106, 160 92, 168 62
           Z" fill="#1a1a1a" opacity="0.9"/>

  <!-- Sand piled in the bottom bulb (a growing heap) -->
  <path d="M128 138
           C 118 152, 92 170, 86 200
           L 170 200
           C 164 170, 138 152, 128 138
           Z" fill="#1a1a1a" opacity="0.9"/>

  <!-- Falling stream of sand through the neck -->
  <rect x="125" y="126" width="6" height="66" rx="3" fill="#1a1a1a"/>

  <!-- A couple of falling grains for life -->
  <circle cx="128" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="128" cy="176" r="2.5" fill="#1a1a1a"/>
</svg>
